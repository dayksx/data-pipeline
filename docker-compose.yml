x-airflow-common: &airflow-common
  image: pipeline-airflow:2.9.2-java17
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment:
    AIRFLOW_UID: "50000"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  volumes:
    - ./airflow/dags:/opt/airflow/dags:z
    - ./airflow/logs:/opt/airflow/logs:z
    - ./:/opt/pipeline:z
  depends_on:
    - postgres

services:
  postgres:
    image: postgres:16
    container_name: pipeline-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:z

  spark-master:
    image: bitnamilegacy/spark:3.5.1
    container_name: pipeline-spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./:/opt/pipeline:z

  spark-worker:
    image: bitnamilegacy/spark:3.5.1
    container_name: pipeline-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./:/opt/pipeline:z
    depends_on:
      - spark-master

  airflow-init:
    <<: *airflow-common
    container_name: pipeline-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: pipeline-airflow-webserver
    command: webserver
    ports:
      - "8088:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data: