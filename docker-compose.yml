x-airflow-common: &airflow-common
  image: pipeline-airflow:2.9.2-java17
  build:
    context: ./airflow
    dockerfile: Dockerfile
  # Fedora/RHEL SELinux: bind mounts need this or `chcon` on airflow/dags and airflow/logs
  security_opt:
    - label:disable
  environment:
    AIRFLOW_UID: "50000"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type":"spark","host":"spark://spark-master:7077"}'
    _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-apache-spark==4.8.1 pyspark==3.5.1

  volumes:
    - ./airflow/dags:/opt/airflow/dags:z
    - ./airflow/logs:/opt/airflow/logs:z
    - ./:/opt/pipeline:z
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    container_name: pipeline-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pipeline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pipeline"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  spark-master:
    image: bitnamilegacy/spark:3.5.1
    container_name: pipeline-spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./:/opt/pipeline:z

  spark-worker:
    image: bitnamilegacy/spark:3.5.1
    container_name: pipeline-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./:/opt/pipeline:z
    depends_on:
      - spark-master

  airflow-init:
    <<: *airflow-common
    container_name: pipeline-airflow-init
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/plugins
        chown -R "$${AIRFLOW_UID}:0" /opt/airflow/logs
        su -s /bin/bash airflow -c "airflow db migrate"
        su -s /bin/bash airflow -c "airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com" || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: pipeline-airflow-webserver
    command: webserver
    ports:
      - "8088:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: pipeline-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      spark-worker:
        condition: service_started
        
volumes:
  postgres_data: