services:
  postgres:
    image: postgres:16
    container_name: pipeline-postgres
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pipeline
    ports: 
     - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:z

  spark-master:
    image: bitnamilegacy/spark:3.5.1
    container_name: pipeline-spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - 8080:8080
    volumes:
      - ./:/opt/pipeline:z

  spark-worker:
    image: bitnamilegacy/spark:3.5.1
    container_name: pipeline-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./:/opt/pipeline:z
    depends_on:
      - spark-master

  airflow-init:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: pipeline-airflow-init
    environment:
      - AIRFLOW_UID=1001
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
    entrypoint: /bin/bash
    command:
      - -c
      - |
      - airflow db migrate
      - airflow users create \
        --username admin \
        --password admin \
        --firstname Admin \
        --lastname User \
        --role Admin \
        --email admin@example.com
    depends_on:
      - postgres
    image: pipeline-airflow-init


volumes:
  postgres_data: