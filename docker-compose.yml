services:
  postgres:
    image: postgres:16
    container_name: pipeline-postgres
    environment: 
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pipeline
    ports: 
     - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:z

  spark-master:
    image: bitnamilegacy/spark:3.5.1
    container_name: pipeline-spark-master
    environment:
      - SPARK_MODE=master
    ports:
      - "7077:7077"
      - 8080:8080
    volumes:
      - ./:/opt/pipeline:z

  spark-worker:
    image: bitnamilegacy/spark:3.5.1
    container_name: pipeline-spark-worker
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    volumes:
      - ./:/opt/pipeline:z
    depends_on:
      - spark-master

volumes:
  postgres_data: